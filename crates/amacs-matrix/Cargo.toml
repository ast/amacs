[package]
name = "amacs-matrix"
description = "The program through which amacs talks to Matrix: the Matrix SDK with its encryption, behind lines of JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
matrix-sdk = { version = "0.20", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "bundled-sqlite", "rustls-aws-lc-rs", "local-server"] }
matrix-sdk-ui = { version = "0.20", default-features = false, features = ["rustls-aws-lc-rs"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }

[lints]
workspace = true

[[bin]]
name = "amacs-matrix"
path = "src/main.rs"
