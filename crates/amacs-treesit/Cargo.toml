[package]
name = "amacs-treesit"
description = "Tree-sitter grammars, syntax highlighting and indentation for amacs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
amacs-text.workspace = true
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cmake = "0.7"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-devicetree = "0.15"
tree-sitter-elisp = "1.7"
tree-sitter-go = "0.25"
tree-sitter-hcl = "1.1"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-scheme = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
