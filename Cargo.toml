[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
amacs-text = { path = "crates/amacs-text" }
amacs-treesit = { path = "crates/amacs-treesit" }
amacs-proto = { path = "crates/amacs-proto" }
amacs-client = { path = "crates/amacs-client" }
amacs-core = { path = "crates/amacs-core" }
amacs-lsp = { path = "crates/amacs-lsp" }
amacs-tty = { path = "crates/amacs-tty" }
amacs-script = { path = "crates/amacs-script" }
amacs-testkit = { path = "crates/amacs-testkit" }

anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
cosmic-text = "0.19"
crossterm = "0.29"
insta = "1"
listenfd = "1"
nucleo = "0.5"
png = "0.18"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
# Line breaks are LF only, as in Emacs: no default `unicode_lines`/`cr_lines`.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
slotmap = "1"
smithay-client-toolkit = "0.21"
steel-core = "0.8.3"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Snapshot and property tests are much faster with optimised dependencies.
[profile.dev.package."*"]
opt-level = 2
