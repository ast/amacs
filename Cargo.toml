[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
amacs-text = { path = "crates/amacs-text" }
amacs-treesit = { path = "crates/amacs-treesit" }
amacs-proto = { path = "crates/amacs-proto" }
amacs-client = { path = "crates/amacs-client" }
amacs-core = { path = "crates/amacs-core" }
amacs-lsp = { path = "crates/amacs-lsp" }
amacs-gpu-surface = { path = "crates/amacs-gpu-surface" }
amacs-gui = { path = "crates/amacs-gui" }
amacs-mcp = { path = "crates/amacs-mcp" }
amacs-tty = { path = "crates/amacs-tty" }
amacs-scheme = { path = "crates/amacs-scheme" }
amacs-script = { path = "crates/amacs-script" }
amacs-testkit = { path = "crates/amacs-testkit" }
amacs-term = { path = "crates/amacs-term" }

# The VT state machine of Alacritty, for the terminal in a buffer.
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
cosmic-text = "0.19"
crossterm = "0.29"
indexmap = "2"
insta = "1"
jiff = "0.2"
listenfd = "1"
nucleo = "0.5"
png = "0.18"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
proptest = "1"
# Line breaks are LF only, as in Emacs: no default `unicode_lines`/`cr_lines`.
spellbook = "0.4"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
sd-notify = "0.5"
stacker = "0.1"
# The version cosmic-text uses: its fonts are handed to swash as they are.
swash = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
slotmap = "1"
smithay-client-toolkit = "0.21"
tempfile = "3"
thiserror = "2"
unicode-width = "0.2"
# The driver of a GPU talks to the system's libwayland, so the window's
# connection has to be libwayland's too.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
# Vulkan only: the window is a Wayland one.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = "0.4"
# Pseudo-terminals, with the controlling terminal set in the child.
portable-pty = "0.9"
raw-window-handle = "0.6"
# Signals to the programs that Scheme code starts.
rustix = { version = "1", features = ["process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The dev profile is what `just restart` and `cargo test` build: one
# incremental build for both. Backtraces keep file and line without full
# debuginfo, which is most of what the linker would otherwise write.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Snapshot and property tests are much faster with optimised dependencies,
# and so is the editor.
[profile.dev.package."*"]
opt-level = 2

# The Scheme interpreter runs everything written in Scheme, also in a debug
# build of the editor.
[profile.dev.package.amacs-scheme]
opt-level = 2
